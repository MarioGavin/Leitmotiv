titulo: Intervalos
resumen: Los [[intervalo|intervalos]] de una octava, con su tamaño en semitonos y su carácter. Cada ejemplo sube desde {n:C4}.
bloques:
  - titulo: Segundas
    texto: |
      - {i:2m}: un semitono. Un roce, casi la misma nota.
      - {i:2M}: un tono. Un paso de escalera.
    ejemplo:
      tempo: 84
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:2 Db4:2 | C4:2 D4:2"
  - titulo: Terceras
    texto: |
      - {i:3m}: tres semitonos. Oscura, recogida.
      - {i:3M}: cuatro semitonos. Luminosa, abierta.
    ejemplo:
      tempo: 84
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:2 Eb4:2 | C4:2 E4:2"
  - titulo: Intervalos justos
    texto: |
      - {i:4J}: cinco semitonos.
      - {i:5J}: siete.
      - {i:8J}: doce. La misma nota, más aguda.

      Suenan firmes y huecos, como una fanfarria.
    ejemplo:
      tempo: 84
      tonalidad: C mayor
      compases: 3
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:2 F4:2 | C4:2 G4:2 | C4:2 C5:2"
  - titulo: Sextas y séptimas
    texto: |
      - {i:6m}: ocho semitonos.
      - {i:6M}: nueve. Cálida, nostálgica.
      - {i:7m}: diez. Pide moverse.
      - {i:7M}: once. Casi la octava, y casi duele.
    ejemplo:
      tempo: 84
      compases: 4
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:2 Ab4:2 | C4:2 A4:2 | C4:2 Bb4:2 | C4:2 B4:2"
  - titulo: El tritono
    texto: |
      {i:4A}, la cuarta aumentada: seis semitonos, la mitad exacta de la octava. Es el
      [[tritono]], el intervalo más inestable: mazmorras, hechizos y jefes.
    ejemplo:
      tempo: 84
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:2 F#4:2 | [C4 F#4]:1"
  - titulo: Reposo y tensión
    texto: |
      A la vez, las terceras, las sextas, las quintas y las octavas descansan: son
      [[consonancia|consonantes]]. Las segundas, las séptimas y el tritono rozan: son
      [[disonancia|disonantes]].
    ejemplo:
      tempo: 66
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "[C4 E4]:2 [C4 G4]:2 | [C4 D4]:2 [C4 B4]:2"
