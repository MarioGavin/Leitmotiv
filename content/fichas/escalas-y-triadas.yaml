titulo: Escalas y tríadas
resumen: Las recetas de las escalas mayor y menor, los cuatro tipos de [[triada|tríada]] y los acordes que salen de una escala mayor.
bloques:
  - titulo: Escala mayor
    texto: |
      Tono, tono, semitono, tono, tono, tono, semitono. Abierta y luminosa. Ejemplo:
      {t:C mayor}, todas las teclas blancas desde Do.
    ejemplo:
      tempo: 96
      tonalidad: C mayor
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:8 D4:8 E4:8 F4:8 G4:8 A4:8 B4:8 C5:8 | C5:2 r:2"
  - titulo: Escala menor
    texto: |
      Tono, semitono, tono, tono, semitono, tono, tono. Más oscura. Ejemplo:
      {t:A menor}, todas las teclas blancas desde La. Comparte notas con {t:C mayor}: es
      su [[relativa]].
    ejemplo:
      tempo: 96
      tonalidad: A menor
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "A3:8 B3:8 C4:8 D4:8 E4:8 F4:8 G4:8 A4:8 | A4:2 r:2"
  - titulo: Cuatro tríadas
    texto: |
      Tres notas apiladas por terceras, de abajo arriba:

      - **Mayor** ({a:C}): tercera mayor y tercera menor.
      - **Menor** ({a:Cm}): tercera menor y tercera mayor.
      - **Disminuida** ({a:Cdim}): dos terceras menores.
      - **Aumentada** ({a:Caug}): dos terceras mayores.
    ejemplo:
      tempo: 72
      compases: 4
      acordes: "C:1 | Cm:1 | Cdim:1 | Caug:1"
      pistas:
        - rol: armonia
          instrumento: piano
          notas: "[C4 E4 G4]:1 | [C4 Eb4 G4]:1 | [C4 Eb4 Gb4]:1 | [C4 E4 G#4]:1"
  - titulo: Los acordes de la escala mayor
    texto: |
      {g:I}, {g:IV} y {g:V}, mayores; {g:ii}, {g:iii} y {g:vi}, menores; {g:vii°},
      disminuido. En {t:C mayor}: {a:C}, {a:Dm}, {a:Em}, {a:F}, {a:G}, {a:Am} y {a:Bdim}.
    ejemplo:
      tempo: 84
      tonalidad: C mayor
      compases: 2
      acordes: "C:4 Dm:4 Em:4 F:4 | G:4 Am:4 Bdim:4 C:4"
      pistas:
        - rol: armonia
          instrumento: piano
          notas: "[C4 E4 G4]:4 [D4 F4 A4]:4 [E4 G4 B4]:4 [F4 A4 C5]:4 | [G4 B4 D5]:4 [A4 C5 E5]:4 [B4 D5 F5]:4 [C5 E5 G5]:4"
  - titulo: Casa, viaje y tensión
    texto: |
      El {g:I} es la tónica, el reposo. El {g:IV} es la [[subdominante]], que se aleja.
      El {g:V} es la [[dominante]], que tensa y empuja de vuelta. {g:V} → {g:I} es la
      [[cadencia]] más fuerte.
    ejemplo:
      tempo: 80
      tonalidad: C mayor
      compases: 4
      acordes: "C:1 | F:1 | G:1 | C:1"
      pistas:
        - rol: armonia
          instrumento: piano
          notas: "[E4 G4 C5]:1 | [F4 A4 C5]:1 | [D4 G4 B4]:1 | [E4 G4 C5]:1"
        - rol: bajo
          instrumento: piano
          notas: "C3:1 | F2:1 | G2:1 | C3:1"
