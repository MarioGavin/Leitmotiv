# Glosario del curso. Se enlaza desde cualquier texto con [[identificador]].
# El orden del archivo no importa: la app lo enseña de la A a la Z.

# ── Ritmo ──

pulso:
  termino: Pulso
  definicion: Latido regular y constante que subyace a la música. Es lo que marcas con el pie sin pensarlo.
  ver: [tempo, compas]

tempo:
  termino: Tempo
  definicion: Velocidad del [[pulso]]. Se mide en pulsos por minuto (BPM, del inglés *beats per minute*).
  ver: [pulso, bpm]

bpm:
  termino: BPM
  definicion: Pulsos por minuto. A 60 BPM hay un pulso cada segundo; a 120, dos.
  ver: [tempo]

compas:
  termino: Compás
  definicion: Agrupación de pulsos en bloques iguales, con un primer pulso que pesa más que los demás. Se escribe como una fracción, 4/4 o 3/4, y se separa con barras.
  ver: [pulso, compas-compuesto, acento]

compas-compuesto:
  termino: Compás compuesto
  definicion: Compás cuyos pulsos se parten en tres, como el 6/8. Se cuenta «UNO-y-a, DOS-y-a» y suena balanceado.
  ver: [compas, subdivision]
  ejemplo:
    titulo: Galope de 6/8
    tempo: 126
    compas: 6/8
    tonalidad: D mayor
    compases: 2
    bucle: true
    pistas:
      - rol: melodia
        instrumento: piano
        notas: "A4:4 D5:8 F#5:4 E5:8 | D5:4 C#5:8 D5:4."
      - rol: bajo
        instrumento: bajo-electrico
        notas: "D2:4. A2:4. | A1:4. D2:4."

acento:
  termino: Acento
  definicion: Golpe o nota que suena con más fuerza que las de alrededor. El primer pulso de cada compás lleva un acento natural.
  ver: [compas]

figura:
  termino: Figura
  definicion: Signo que dice cuánto dura una nota respecto al pulso. Las más usadas son la redonda, la blanca, la negra, la corchea y la semicorchea.
  ver: [redonda, blanca, negra, corchea, semicorchea]

redonda:
  termino: Redonda
  definicion: Figura que dura cuatro negras, un compás entero de 4/4. Se dibuja como una cabeza hueca sin plica.
  ver: [blanca, figura]

blanca:
  termino: Blanca
  definicion: Figura que dura dos negras. Cabeza hueca con plica.
  ver: [redonda, negra]

negra:
  termino: Negra
  definicion: Figura que dura un pulso en los compases de 4/4, 3/4 y 2/4. Cabeza rellena con plica.
  ver: [blanca, corchea]

corchea:
  termino: Corchea
  definicion: Figura que dura media negra. Dos corcheas llenan un pulso.
  ver: [negra, semicorchea, subdivision]

semicorchea:
  termino: Semicorchea
  definicion: Figura que dura un cuarto de negra. Cuatro semicorcheas llenan un pulso.
  ver: [corchea, subdivision]

subdivision:
  termino: Subdivisión
  definicion: Partir el [[pulso]] en partes iguales, en dos (corcheas), en cuatro (semicorcheas) o en tres (en los compases compuestos). Contarla por dentro ayuda a no correr.
  ver: [corchea, semicorchea, compas-compuesto]

silencio:
  termino: Silencio
  definicion: Tiempo en el que no suena nada, escrito con su propia figura. Un silencio de negra dura lo mismo que una negra y se cuenta igual.
  ver: [figura]

puntillo:
  termino: Puntillo
  definicion: Punto detrás de una figura que la alarga la mitad de lo que dura. Una negra con puntillo dura un pulso y medio.
  ver: [figura, negra]

# ── Notas e intervalos ──

semitono:
  termino: Semitono
  definicion: La distancia más pequeña entre dos notas en nuestra música, la que hay de una tecla del piano a la de al lado. De Mi a Fa y de Si a Do hay un semitono.
  ver: [tono, sostenido, bemol]

tono:
  termino: Tono
  definicion: Distancia de dos [[semitono|semitonos]]. De Do a Re hay un tono.
  ver: [semitono]

sostenido:
  termino: Sostenido
  definicion: Alteración (♯) que sube una nota un semitono. {n:F#4} es el Fa sostenido.
  ver: [bemol, semitono]

bemol:
  termino: Bemol
  definicion: Alteración (♭) que baja una nota un semitono. {n:Bb3} es el Si bemol. Una tecla negra tiene un nombre con sostenido y otro con bemol.
  ver: [sostenido, semitono]

octava:
  termino: Octava
  definicion: Intervalo de doce semitonos. La nota de arriba se llama igual que la de abajo y suena casi idéntica, más aguda. El número de una nota ({n:C4}, {n:C5}) dice en qué octava está.
  ver: [intervalo, registro]

registro:
  termino: Registro
  definicion: Franja de notas en la que se mueve una voz o un instrumento. Se habla de registro grave, medio y agudo.
  ver: [octava, timbre]

timbre:
  termino: Timbre
  definicion: El color de un sonido, lo que distingue un piano de unas cuerdas aunque toquen la misma nota.
  ver: [registro]

intervalo:
  termino: Intervalo
  definicion: Distancia entre dos notas. Se nombra por el número de notas que abarca (segunda, tercera, cuarta…) y por su tamaño exacto en semitonos (mayor, menor, justa).
  ver: [semitono, consonancia, tritono]
  ejemplo:
    titulo: De la segunda a la octava
    tempo: 92
    tonalidad: C mayor
    compases: 4
    pistas:
      - rol: melodia
        instrumento: piano
        notas: "C4:4 D4:4 C4:4 E4:4 | C4:4 F4:4 C4:4 G4:4 | C4:4 A4:4 C4:4 B4:4 | C4:2 C5:2"

consonancia:
  termino: Consonancia
  definicion: Intervalo o acorde que suena a reposo, como las terceras, las sextas, las quintas y las octavas.
  ver: [disonancia, intervalo]

disonancia:
  termino: Disonancia
  definicion: Intervalo o acorde que suena a tensión y pide moverse, como las segundas, las séptimas y el tritono. No es un error, es el motor de la música.
  ver: [consonancia, tritono]

tritono:
  termino: Tritono
  definicion: Intervalo de tres tonos (seis semitonos) que parte la octava por la mitad. Es la cuarta aumentada, y suena inestable e inquietante.
  ver: [disonancia, intervalo]
  ejemplo:
    titulo: La cripta
    tempo: 66
    compases: 2
    bucle: true
    pistas:
      - rol: colchon
        instrumento: cuerdas
        matiz: p
        notas: "[E4 Bb4]:1 | [E4 Bb4]:1"
      - rol: bajo
        instrumento: bajo-electrico
        notas: "E2:2 Bb2:2 | E2:2 Bb2:2"

# ── Escalas y acordes ──

escala:
  termino: Escala
  definicion: Sucesión ordenada de notas que va de una nota a su octava siguiendo una receta de tonos y semitonos. Las notas de una pieza suelen salir de una escala.
  ver: [escala-mayor, escala-menor, tonica]

escala-mayor:
  termino: Escala mayor
  definicion: Escala con la receta tono, tono, semitono, tono, tono, tono, semitono. Suena abierta y luminosa.
  ver: [escala, escala-menor]
  ejemplo:
    titulo: Escala de Re mayor
    tempo: 92
    tonalidad: D mayor
    compases: 2
    pistas:
      - rol: melodia
        instrumento: piano
        notas: "D4:8 E4:8 F#4:8 G4:8 A4:8 B4:8 C#5:8 D5:8 | C#5:8 B4:8 A4:8 G4:8 F#4:8 E4:8 D4:4"

escala-menor:
  termino: Escala menor
  definicion: Escala con la receta tono, semitono, tono, tono, semitono, tono, tono. Su tercera más baja le da un color oscuro.
  ver: [escala, escala-mayor, relativa]
  ejemplo:
    titulo: Escala de La menor
    tempo: 88
    tonalidad: A menor
    compases: 2
    pistas:
      - rol: melodia
        instrumento: piano
        notas: "A3:8 B3:8 C4:8 D4:8 E4:8 F4:8 G4:8 A4:8 | G4:8 F4:8 E4:8 D4:8 C4:8 B3:8 A3:4"

tonica:
  termino: Tónica
  definicion: Primera nota de una escala y centro de la tonalidad. Es donde la música descansa.
  ver: [tonalidad, escala]

tonalidad:
  termino: Tonalidad
  definicion: La tónica de una pieza junto con su escala. {t:D mayor} quiere decir casa en Re y notas de la escala mayor de Re.
  ver: [tonica, escala, relativa]

relativa:
  termino: Tonalidad relativa
  definicion: Tonalidad mayor y menor que comparten las mismas notas con distinta tónica, como {t:C mayor} y {t:A menor}.
  ver: [tonalidad, escala-menor]

acorde:
  termino: Acorde
  definicion: Tres o más notas que suenan juntas, o se entienden como un bloque aunque suenen una tras otra. Se nombran en cifrado americano, como {a:C}, {a:Am} o {a:G7}.
  ver: [triada, arpegio, cifrado]

triada:
  termino: Tríada
  definicion: Acorde de tres notas apiladas por terceras, la fundamental, la tercera y la quinta. Puede ser mayor, menor, disminuida o aumentada.
  ver: [acorde, fundamental]
  ejemplo:
    tempo: 72
    compases: 4
    acordes: "C:1 | Cm:1 | Bdim:1 | Caug:1"
    pistas:
      - rol: armonia
        instrumento: piano
        notas: "[C4 E4 G4]:1 | [C4 Eb4 G4]:1 | [B3 D4 F4]:1 | [C4 E4 G#4]:1"

fundamental:
  termino: Fundamental
  definicion: Nota sobre la que se construye un acorde y que le da nombre. La fundamental de {a:Am} es La.
  ver: [triada, acorde]

arpegio:
  termino: Arpegio
  definicion: Las notas de un acorde tocadas una detrás de otra en lugar de a la vez. Es el truco de los chips de 8 bits para sonar a acorde con una sola voz.
  ver: [acorde]
  ejemplo:
    titulo: Pantalla de continuar
    tempo: 120
    tonalidad: A menor
    compases: 2
    bucle: true
    acordes: "Am:1 | F:1"
    pistas:
      - rol: armonia
        instrumento: chip-pulso
        notas: "A4:16 C5:16 E5:16 C5:16 A4:16 C5:16 E5:16 C5:16 A4:16 C5:16 E5:16 C5:16 A4:16 C5:16 E5:16 C5:16 | A4:16 C5:16 F5:16 C5:16 A4:16 C5:16 F5:16 C5:16 A4:16 C5:16 F5:16 C5:16 A4:16 C5:16 F5:16 C5:16"
      - rol: bajo
        instrumento: chip-triangulo
        notas: "A2:4 A2:4 A2:4 A2:4 | F2:4 F2:4 F2:4 F2:4"

cifrado:
  termino: Cifrado
  definicion: Forma de escribir un acorde con letras y símbolos. La letra es la fundamental (A es La, B es Si, C es Do…), «m» indica menor y «dim», disminuido.
  ver: [acorde, grado]

grado:
  termino: Grado
  definicion: Posición de una nota o de un acorde dentro de la escala, escrita en cifras romanas. En mayúscula si el acorde es mayor ({g:IV}) y en minúscula si es menor ({g:vi}).
  ver: [tonica, subdominante, dominante]

subdominante:
  termino: Subdominante
  definicion: El acorde del cuarto grado, {g:IV}. Se aleja de la tónica sin tensión, como quien sale de viaje.
  ver: [dominante, grado]

dominante:
  termino: Dominante
  definicion: El acorde del quinto grado, {g:V}. Crea tensión y empuja de vuelta a la tónica.
  ver: [subdominante, cadencia, grado]

cadencia:
  termino: Cadencia
  definicion: Manera de cerrar una frase con acordes. La más fuerte es la de dominante a tónica, {g:V} → {g:I}.
  ver: [dominante, tonica]

# ── Música de videojuego ──

bucle:
  termino: Bucle
  definicion: Fragmento de música pensado para repetirse sin fin y sin que se note la costura. Es la forma habitual de la música de videojuegos.
  ver: [compas, capa]
  ejemplo:
    titulo: Camino de la pradera
    tempo: 104
    tonalidad: D mayor
    compases: 4
    bucle: true
    acordes: "D:1 | G:2 A:2 | Bm:1 | G:2 A:2"
    pistas:
      - rol: melodia
        instrumento: piano
        notas: "A4:4 D5:4 F#5:4. E5:8 | D5:4 B4:4 A4:4 C#5:4 | D5:4. F#5:8 E5:4 D5:4 | B4:4 G4:4 A4:4. C#5:8"
      - rol: colchon
        instrumento: cuerdas
        notas: "[A3 D4 F#4]:1 | [B3 D4 G4]:2 [A3 C#4 E4]:2 | [B3 D4 F#4]:1 | [B3 D4 G4]:2 [A3 C#4 E4]:2"
      - rol: bajo
        instrumento: bajo-electrico
        notas: "D2:4 D2:8 D2:8 A2:4 D2:4 | G2:4 G2:4 A2:4 A2:8 A2:8 | B1:4 B1:8 B1:8 F#2:4 B1:4 | G2:4 G2:4 A2:4 E2:8 A2:8"
      - rol: percusion
        instrumento: bateria
        rejilla:
          paso: "8"
          lineas:
            charles: "xoxoxoxo"
            caja: "..x...x."
            bombo: "x..x.x.."

motivo:
  termino: Motivo
  definicion: Idea musical corta, de tres a seis notas, que se reconoce cada vez que vuelve. Los temas de los personajes se construyen a partir de motivos.
  ver: [intervalo]

capa:
  termino: Capa
  definicion: Cada una de las partes de un [[bucle]] que el juego puede encender o apagar según lo que pase, sin cortar la música.
  ver: [bucle]
