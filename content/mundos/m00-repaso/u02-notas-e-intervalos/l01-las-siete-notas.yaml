titulo: Las siete notas
resumen: Encontrar las siete notas en el teclado y en el piano roll, y oír si una melodía sube o baja.
minutos: 7
conceptos: [notas]

pasos:
  - tipo: teoria
    titulo: Do, Re, Mi… y vuelta a empezar
    texto: |
      Las teclas blancas del piano se llaman Do, Re, Mi, Fa, Sol, La y Si, y después
      vuelven a empezar. Para encontrar un Do, busca un grupo de dos teclas negras: el
      Do es la blanca que queda justo a su izquierda.

      Escucha cómo se encienden las teclas: la escala sube de {n:C4}, el Do central,
      hasta {n:C5}, y luego una frase corta vuelve a bajar.
    vista: teclado
    manipulable: [tempo, instrumento]
    ejemplo:
      tempo: 96
      tonalidad: C mayor
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:8 D4:8 E4:8 F4:8 G4:8 A4:8 B4:8 C5:8 | G4:4 E4:4 C4:2"

  - tipo: oido
    modo: contorno
    concepto: notas
    enunciado: ¿La segunda nota sube o baja?
    pista: Imagina que cantas las dos notas. ¿Tienes que estirar el cuello o bajar la barbilla?
    explicacion: |
      Una nota más aguda está más arriba en el teclado (a la derecha) y en el piano roll
      (más alta en la rejilla). Una más grave, más abajo.
    intervalos: [2M, 3M, 5J]
    registro: [C4, C5]
    rondas: 6

  - tipo: teoria
    titulo: En el piano roll, arriba es agudo
    texto: |
      El piano roll es el mismo teclado puesto de pie: cada fila es una tecla, las
      agudas arriba y las graves abajo. El tiempo corre de izquierda a derecha, y cada
      nota es una barra tan larga como lo que dura.

      Este tema de subir a la torre trepa nota a nota y se asoma arriba del todo antes de
      bajar. Míralo dibujado mientras suena.
    manipulable: [tempo, instrumento]
    ejemplo:
      titulo: Subida a la torre
      tempo: 100
      tonalidad: C mayor
      compases: 4
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:4 E4:4 D4:4 F4:4 | E4:4 G4:4 F4:4 A4:4 | G4:4 C5:4 E5:2 | D5:4 B4:4 C5:2"
        - rol: bajo
          instrumento: bajo-electrico
          notas: "C2:1 | C2:1 | E2:1 | G2:2 C2:2"

  - tipo: analisis
    concepto: notas
    enunciado: Escucha la subida a la torre y responde.
    pista: Mira qué barra queda más alta en la rejilla y cuál es la última.
    explicacion: |
      La nota más aguda es la que queda más arriba en el piano roll. Para nombrarla,
      cuenta filas desde un Do: al margen están rotuladas las filas de cada Do.
    pieza:
      titulo: Subida a la torre
      tempo: 100
      tonalidad: C mayor
      compases: 4
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "C4:4 E4:4 D4:4 F4:4 | E4:4 G4:4 F4:4 A4:4 | G4:4 C5:4 E5:2 | D5:4 B4:4 C5:2"
    preguntas:
      - sobre: libre
        pregunta: ¿Cuál es la nota más aguda?
        opciones: ["{n:C5}", "{n:E5}", "{n:G5}"]
        correcta: 2
        explicacion: El {n:E5} del tercer compás es el punto más alto de la subida.
      - sobre: libre
        pregunta: ¿En qué nota termina?
        opciones: ["{n:C4}", "{n:B4}", "{n:C5}"]
        correcta: 3
        explicacion: Termina en {n:C5}, una octava por encima de donde empezó.

  - tipo: pianoroll
    concepto: notas
    enunciado: Escribe la escala de Do subiendo, de {n:C4} a {n:C5}, una nota detrás de otra.
    pista: Empieza en la fila de {n:C4} y sube una fila clara cada vez. Las filas oscuras son las teclas negras, y aquí no hacen falta.
    explicacion: |
      Do, Re, Mi, Fa, Sol, La, Si y otra vez Do: ocho notas que suben por las teclas
      blancas. Es la escala que vas a usar como regla para medir todo lo demás.
    plantilla:
      titulo: La escala de Do
      tempo: 90
      tonalidad: C mayor
      compases: 2
      pistas:
        - rol: melodia
          instrumento: piano
          notas: ""
    editables: [melodia]
    requisitos:
      - regla: tonalidad
        valores: [C mayor]
        minimo: 1
      - regla: rango
        pista: melodia
        min: C4
        max: C5
      - regla: notas-minimas
        pista: melodia
        valor: 8
      - regla: polifonia
        pista: melodia
        max: 1
      - regla: empieza-en
        pista: melodia
        grados: [1]
      - regla: termina-en
        pista: melodia
        grados: [1]
