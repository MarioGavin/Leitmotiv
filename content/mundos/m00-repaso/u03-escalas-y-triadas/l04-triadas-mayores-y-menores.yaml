titulo: Tríadas mayores y menores
resumen: Formar una tríada apilando terceras y distinguir de oído la mayor de la menor.
minutos: 8
conceptos: [triadas, segundas-y-terceras]

pasos:
  - tipo: teoria
    titulo: Tres notas a la vez
    texto: |
      Una [[triada|tríada]] es un [[acorde]] de tres notas apiladas por terceras: la
      [[fundamental]], su tercera y su quinta. Si la tercera de abajo es mayor, la tríada
      es **mayor** ({a:C}); si es menor, la tríada es **menor** ({a:Cm}).

      Mira el teclado: entre {a:C} y {a:Cm} solo se mueve una tecla, la del medio. Esa
      tecla decide si el acorde suena a día o a noche.
    vista: teclado
    manipulable: [tempo, instrumento]
    ejemplo:
      tempo: 72
      compases: 4
      acordes: "C:1 | Cm:1 | A:1 | Am:1"
      pistas:
        - rol: armonia
          instrumento: piano
          notas: "[C4 E4 G4]:1 | [C4 Eb4 G4]:1 | [A3 C#4 E4]:1 | [A3 C4 E4]:1"

  - tipo: oido
    modo: acorde
    concepto: triadas
    enunciado: ¿El acorde es mayor o menor?
    pista: El mayor suena abierto y estable; el menor, más recogido, con un punto de melancolía.
    explicacion: |
      Las dos tríadas comparten fundamental y quinta. Solo cambia la tercera: cuatro
      semitonos en la mayor, tres en la menor.
    calidades: [M, m]
    presentacion: bloque
    registro: [C3, C4]
    rondas: 6

  - tipo: teoria
    titulo: Arpegios de 8 bits
    texto: |
      Un acorde no tiene por qué sonar de golpe. Si sus notas suenan una detrás de otra,
      es un [[arpegio]]. Las consolas antiguas solo podían tocar una nota por canal, así
      que arpegiaban rapidísimo para que el oído juntara las notas en un acorde.

      Escucha este arpegio de chip sobre {a:Am}, {a:F}, {a:C} y {a:G}.
    manipulable: [tempo, pistas]
    ejemplo:
      titulo: Pantalla de continuar
      tempo: 120
      tonalidad: A menor
      compases: 4
      bucle: true
      acordes: "Am:1 | F:1 | C:1 | G:1"
      pistas:
        - rol: armonia
          instrumento: chip-pulso
          notas: "A4:16 C5:16 E5:16 C5:16 A4:16 C5:16 E5:16 C5:16 A4:16 C5:16 E5:16 C5:16 A4:16 C5:16 E5:16 C5:16 | A4:16 C5:16 F5:16 C5:16 A4:16 C5:16 F5:16 C5:16 A4:16 C5:16 F5:16 C5:16 A4:16 C5:16 F5:16 C5:16 | G4:16 C5:16 E5:16 C5:16 G4:16 C5:16 E5:16 C5:16 G4:16 C5:16 E5:16 C5:16 G4:16 C5:16 E5:16 C5:16 | G4:16 B4:16 D5:16 B4:16 G4:16 B4:16 D5:16 B4:16 G4:16 B4:16 D5:16 B4:16 G4:16 B4:16 D5:16 B4:16"
        - rol: bajo
          instrumento: chip-triangulo
          notas: "A2:4 A2:4 A2:4 A2:4 | F2:4 F2:4 F2:4 F2:4 | C3:4 C3:4 C3:4 C3:4 | G2:4 G2:4 G2:4 G2:4"

  - tipo: oido
    modo: acorde
    concepto: triadas
    enunciado: Ahora arpegiado. ¿Mayor o menor?
    pista: Escucha la segunda nota del arpegio, la tercera del acorde. Es la que da el color.
    explicacion: |
      Arpegiado o en bloque, el color es el mismo: lo decide la tercera, la segunda nota
      que suena.
    calidades: [M, m]
    presentacion: arpegio
    registro: [C3, C4]
    rondas: 6

  - tipo: construccion
    modo: elegir-acorde
    concepto: triadas
    enunciado: Elige el acorde del segundo compás.
    pista: La melodía del segundo compás toca {n:A4}, {n:C5} y {n:E5}. Busca el acorde que tenga esas tres notas.
    explicacion: |
      {n:A4}, {n:C5} y {n:E5} son exactamente las notas de {a:Am}: La, su tercera menor y
      su quinta. {a:A} llevaría {n:C#5}, que choca con el Do de la melodía.
    pieza:
      tempo: 96
      tonalidad: C mayor
      compases: 4
      acordes: "C:1 | ?:1 | F:1 | G:1"
      pistas:
        - rol: melodia
          instrumento: piano
          notas: "G4:4 E4:4 C5:4 G4:4 | A4:4 C5:4 E5:2 | F5:4 C5:4 A4:4 F4:4 | G4:4 B4:4 D5:2"
        - rol: bajo
          instrumento: bajo-electrico
          notas: "C2:1 | A1:1 | F1:1 | G1:1"
    opciones:
      - acorde: Am
        correcta: true
        porque: Tiene La, Do y Mi, las tres notas de la melodía. Es una tríada menor.
      - acorde: A
        correcta: false
        porque: La tríada mayor de La lleva Do sostenido, y la melodía toca Do natural. Chocan.
      - acorde: Em
        correcta: false
        porque: Tiene Mi, pero no La ni Do. Dos de las tres notas de la melodía se quedarían fuera.
